[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pythonx-concurrent"
version = "0.0.1a1"
description = "Structured concurrency for Python on Kotlin Multiplatform: coroutines that interoperate with Kotlin coroutines and asyncio"
readme = {file = "README.md", content-type = "text/markdown"}
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [
    {name = "BREW (b-re-w)"},
]
keywords = ["concurrency", "coroutines", "asyncio", "kotlin-multiplatform", "python-multiplatform"]
classifiers = [
    "Development Status :: 1 - Planning",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
]
dependencies = []
requires-python = ">= 3.15"

[project.urls]
Homepage = "https://thisisthepy.github.io/projects/pythonx-concurrent/"
Source = "https://github.com/thisisthepy/pythonx-concurrent"
Issues = "https://github.com/thisisthepy/pythonx-concurrent/issues"

[tool.setuptools.packages.find]
include = ["pythonx.concurrent*"]
