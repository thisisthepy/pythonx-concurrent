name: Test

# Runs the suite on CPython 3.15 (GIL, with the TypedPython soundness gate from
# python-multiplatform develop) and on free-threaded CPython 3.15t.
on:
  push:
    branches: [develop]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test-315:
    name: Run tests (ubuntu-latest, 3.15)
    runs-on: ubuntu-latest
    env:
      PYTHONMULTIPLATFORM_HOME: ${{ github.workspace }}/python-multiplatform
    defaults:
      run:
        working-directory: pythonx-concurrent
    steps:
      - uses: actions/checkout@v4
        with:
          path: pythonx-concurrent
          fetch-depth: 1
      - uses: actions/checkout@v4
        with:
          repository: thisisthepy/python-multiplatform
          ref: develop
          path: python-multiplatform
          fetch-depth: 1
      - uses: astral-sh/setup-uv@v6
      - run: uv python install 3.15
      - name: Run each test module separately on 3.15
        run: |
          for f in tests/test_package.py tests/test_scope_and_jobs.py tests/test_dispatchers_and_loops.py tests/test_coroutine_scope.py; do
            uv run --python 3.15 --with pytest --with "pyrefly==1.3.2" pytest "$f" -q -rs
          done

  test-315t:
    name: Run tests (ubuntu-latest, 3.15t)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: astral-sh/setup-uv@v6
      - run: uv python install 3.15t
      - name: Run each test module separately on 3.15t
        run: |
          for f in tests/test_package.py tests/test_scope_and_jobs.py tests/test_dispatchers_and_loops.py tests/test_coroutine_scope.py; do
            uv run --python 3.15t --with pytest pytest "$f" -q -rs
          done
